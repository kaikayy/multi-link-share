<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1730"/>
      <stop offset="1" stop-color="#0e0c17"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7dff"/>
      <stop offset="0.55" stop-color="#d76ad4"/>
      <stop offset="1" stop-color="#ff9d6c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="360" fill="#8b7dff" opacity="0.10"/>

  <g transform="translate(96,150)">
    <rect x="0" y="0" width="92" height="92" rx="24" fill="url(#logo)"/>
    <rect x="20" y="22" width="42" height="48" rx="7" fill="#ffffff"/>
    <rect x="36" y="16" width="42" height="48" rx="7" fill="#ffffff" opacity="0.62"/>
  </g>

  <text x="212" y="196" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="40" font-weight="700" fill="#f2f0ff">Tab Share</text>
  <text x="212" y="238" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="22" fill="#b7b0d8">a shared set of pages</text>

  <text x="96" y="360" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="60" font-weight="800" fill="#f5f3ff">Opens as a slideshow.</text>
  <text x="96" y="440" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="500" fill="#cfc9e8">The whole page list lives inside the link —</text>
  <text x="96" y="486" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="500" fill="#cfc9e8">no account, no server, nothing tracked.</text>

  <g transform="translate(96,536)">
    <rect x="0" y="0" width="320" height="44" rx="22" fill="#2b2545" stroke="#4a4276"/>
    <text x="160" y="29" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
          font-size="18" font-weight="600" fill="#e7e3ff">safe to open · open source</text>
  </g>
</svg>
