<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191527"/><stop offset="1" stop-color="#241a33"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7dff"/><stop offset="0.55" stop-color="#d76ad4"/><stop offset="1" stop-color="#ff9d6c"/>
    </linearGradient>
    <filter id="win" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="38" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <circle cx="1150" cy="80" r="340" fill="#8b7dff" opacity="0.10"/>

  <g transform="translate(40,36)" filter="url(#win)">
    <rect width="1200" height="728" rx="18" fill="#17171d" stroke="#33333d"/>
    <clipPath id="clipO"><rect width="1200" height="728" rx="18"/></clipPath>
    <g clip-path="url(#clipO)">
      <!-- browser chrome -->
      <rect width="1200" height="38" fill="#101016"/>
      <path d="M22 38 v-22 a8 8 0 0 1 8 -8 h150 a8 8 0 0 1 8 8 v22 Z" fill="#17171d"/>
      <rect x="38" y="16" width="12" height="12" rx="3" fill="url(#mark)"/>
      <text x="58" y="26" fill="#c9c4de" font-size="11" font-weight="600">Tab Share &#8212; Settings</text>
      <rect width="1200" height="36" y="38" fill="#1c1c22"/>
      <rect x="22" y="46" width="1156" height="20" rx="10" fill="#0f0f16"/>
      <text x="38" y="60" fill="#7c7c8c" font-size="11" font-family="ui-monospace, Menlo, monospace">chrome-extension://&#8230;/src/options.html</text>

      <!-- page head -->
      <text x="120" y="120" fill="#f2f0ff" font-size="22" font-weight="800">Tab Share settings</text>
      <text x="120" y="144" fill="#9a9aa8" font-size="12.5">Everything is optional and stored on this device only.</text>

      <!-- welcome header (highlighted, first open) -->
      <g transform="translate(120,162)">
        <rect width="960" height="66" rx="12" fill="#2c2748"/>
        <text x="18" y="26" fill="#c9b8ff" font-size="11" font-weight="700" letter-spacing="0.6">WELCOME TO TAB SHARE</text>
        <text x="18" y="48" fill="#e7e3ff" font-size="12.5">Pick your setup below, then use the toolbar button to turn a group of tabs into one link.</text>
      </g>

      <!-- left column -->
      <g transform="translate(120,246)">
        <!-- preferences -->
        <rect width="288" height="280" rx="12" fill="#1d1d25" stroke="#33333d"/>
        <text x="16" y="26" fill="#9a9aa8" font-size="11" font-weight="700" letter-spacing="0.6">PREFERENCES</text>
        <g font-size="12" font-weight="600" fill="#ececf1">
          <rect x="16" y="42" width="15" height="15" rx="4" fill="#24242e" stroke="#4a4a5c"/>
          <text x="40" y="54">Show real site icons</text>
          <rect x="16" y="88" width="15" height="15" rx="4" fill="#2c2748" stroke="#4a4276"/>
          <path d="M20 96l3 3 5-6" stroke="#9a8dff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="40" y="100">Auto-load live previews</text>
          <rect x="16" y="134" width="15" height="15" rx="4" fill="#2c2748" stroke="#4a4276"/>
          <path d="M20 142l3 3 5-6" stroke="#9a8dff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="40" y="146">Show "Open with Tab Share"</text>
          <rect x="16" y="180" width="15" height="15" rx="4" fill="#2c2748" stroke="#4a4276"/>
          <path d="M20 188l3 3 5-6" stroke="#9a8dff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="40" y="192">Open its menu automatically</text>
        </g>
        <text x="16" y="232" fill="#9a9aa8" font-size="11" font-weight="600">Default action</text>
        <rect x="16" y="240" width="256" height="30" rx="8" fill="#24242e" stroke="#3a3a47"/>
        <text x="30" y="259" fill="#ececf1" font-size="12">Ask each time</text>
        <path d="M256 250l6 6 6-6" stroke="#7c7c8c" stroke-width="2" fill="none" stroke-linecap="round"/>

        <!-- support -->
        <g transform="translate(0,296)">
          <rect width="288" height="150" rx="12" fill="#1d1d25" stroke="#33333d"/>
          <text x="16" y="26" fill="#9a9aa8" font-size="11" font-weight="700" letter-spacing="0.6">SUPPORT &amp; FEEDBACK</text>
          <g transform="translate(16,40)">
            <rect width="220" height="40" rx="11" fill="#FF5E5B"/>
            <g transform="translate(14,8)" fill="#fff">
              <circle cx="5" cy="6" r="4"/><circle cx="11" cy="4" r="5"/><circle cx="17" cy="6" r="4"/>
              <rect x="2" y="7" width="16" height="18" rx="3"/>
              <path d="M18 10 h4 a4.5 4.5 0 0 1 0 9 h-4" fill="none" stroke="#fff" stroke-width="2.6"/>
            </g>
            <text x="46" y="25" fill="#fff" font-size="13.5" font-weight="700">Buy me a Beer</text>
            <text x="206" y="26" text-anchor="end" fill="#fff" font-size="10" font-weight="600" opacity="0.9">ko-fi</text>
          </g>
          <text x="16" y="106" fill="#9a8dff" font-size="12">Report a bug</text>
          <text x="112" y="106" fill="#9a8dff" font-size="12">Request a feature</text>
          <text x="16" y="128" fill="#9a8dff" font-size="12">Source &amp; docs</text>
        </g>
      </g>

      <!-- right column -->
      <g transform="translate(432,246)">
        <!-- viewer -->
        <rect width="648" height="132" rx="12" fill="#1d1d25" stroke="#33333d"/>
        <text x="18" y="28" fill="#9a9aa8" font-size="11" font-weight="700" letter-spacing="0.6">VIEWER BASE URL</text>
        <text x="18" y="50" fill="#9a9aa8" font-size="11.5">Where a share link opens. Must be an https:// address you control.</text>
        <rect x="18" y="62" width="612" height="32" rx="9" fill="#24242e" stroke="#3a3a47"/>
        <text x="32" y="83" fill="#ececf1" font-size="12" font-family="ui-monospace, Menlo, monospace">https://kaikayy.github.io/multi-link-share/</text>
        <rect x="18" y="104" width="54" height="18" rx="6" fill="#9a8dff"/>
        <text x="45" y="117" text-anchor="middle" fill="#16121f" font-size="11" font-weight="700">Save</text>

        <!-- shorten -->
        <g transform="translate(0,148)">
          <rect width="648" height="266" rx="12" fill="#1d1d25" stroke="#33333d"/>
          <text x="18" y="28" fill="#9a9aa8" font-size="11" font-weight="700" letter-spacing="0.6">SHORTEN LINKS (OPTIONAL)</text>
          <g transform="translate(18,42)" font-size="12">
            <rect width="200" height="32" rx="9" fill="#24242e" stroke="#3a3a47"/>
            <text x="14" y="21" fill="#ececf1">Tab Share shortener</text>
            <rect x="214" width="230" height="32" rx="9" fill="#24242e" stroke="#3a3a47"/>
            <text x="228" y="21" fill="#ececf1" font-family="ui-monospace, Menlo, monospace">https://tabsha.re</text>
            <rect x="458" width="154" height="32" rx="9" fill="#24242e" stroke="#3a3a47"/>
            <text x="472" y="21" fill="#ececf1">Readable words</text>
          </g>
          <g transform="translate(18,92)">
            <rect width="612" height="86" rx="10" fill="#20202c" stroke="#4a4276"/>
            <rect width="3" height="86" rx="1.5" fill="#9a8dff"/>
            <text x="16" y="24" fill="#c9c4de" font-size="11.5" font-weight="600">Your Viewer base URL is always yours to set.</text>
            <text x="16" y="44" fill="#9a9aa8" font-size="11">A shortener only shortens links whose viewer host is on its allowlist. Your own</text>
            <text x="16" y="60" fill="#9a9aa8" font-size="11">shortener allows your own viewer; someone else's has to opt your host in.</text>
          </g>
          <rect x="18" y="196" width="15" height="15" rx="4" fill="#24242e" stroke="#4a4a5c"/>
          <text x="42" y="208" fill="#ececf1" font-size="12" font-weight="600">Shorten automatically</text>
        </g>
      </g>

      <!-- history spans right column, bottom -->
      <g transform="translate(432,674)">
        <rect width="648" height="118" rx="12" fill="#1d1d25" stroke="#33333d"/>
        <text x="18" y="28" fill="#9a9aa8" font-size="11" font-weight="700" letter-spacing="0.6">HISTORY</text>
        <text x="18" y="52" fill="#9a9aa8" font-size="12" font-family="ui-monospace, Menlo, monospace">Research on hummingbirds &#183; 7 pages &#183; today</text>
        <text x="18" y="72" fill="#9a9aa8" font-size="12" font-family="ui-monospace, Menlo, monospace">Q3 launch reading &#183; 12 pages &#183; yesterday</text>
      </g>
    </g>
  </g>

  <text x="640" y="784" text-anchor="middle" fill="#6b6b78" font-size="13">Options page &#8212; preferences left, the bigger tiles right, nothing to scroll but Privacy</text>
</svg>
