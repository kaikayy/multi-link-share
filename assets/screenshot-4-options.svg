<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191527"/><stop offset="1" stop-color="#241a33"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7dff"/><stop offset="0.55" stop-color="#d76ad4"/><stop offset="1" stop-color="#ff9d6c"/>
    </linearGradient>
    <filter id="win" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="38" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <circle cx="1150" cy="80" r="340" fill="#8b7dff" opacity="0.10"/>

  <g transform="translate(40,36)" filter="url(#win)">
    <rect width="1200" height="728" rx="18" fill="#17171d" stroke="#33333d"/>
    <clipPath id="clipO"><rect width="1200" height="728" rx="18"/></clipPath>
    <g clip-path="url(#clipO)">
      <rect width="1200" height="38" fill="#101016"/>
      <path d="M22 38 v-22 a8 8 0 0 1 8 -8 h150 a8 8 0 0 1 8 8 v22 Z" fill="#17171d"/>
      <rect x="38" y="16" width="12" height="12" rx="3" fill="url(#mark)"/>
      <text x="58" y="26" fill="#c9c4de" font-size="11" font-weight="600">Tab Share &#8212; Settings</text>
      <rect width="1200" height="36" y="38" fill="#1c1c22"/>
      <rect x="22" y="46" width="1156" height="20" rx="10" fill="#0f0f16"/>
      <text x="38" y="60" fill="#7c7c8c" font-size="11" font-family="ui-monospace, Menlo, monospace">chrome-extension://&#8230;/src/options.html</text>

      <!-- page head: gear + Tab Share -->
      <g transform="translate(120,96)">
        <path fill="#9a9aa8" transform="scale(0.95)" d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Zm7.4-2.1 1.8-1-1.7-3-2 .5a6 6 0 0 0-1.7-1l-.3-2h-3.4l-.3 2a6 6 0 0 0-1.7 1l-2-.5-1.7 3 1.8 1a6 6 0 0 0 0 2l-1.8 1 1.7 3 2-.5a6 6 0 0 0 1.7 1l.3 2h3.4l.3-2a6 6 0 0 0 1.7-1l2 .5 1.7-3-1.8-1a6 6 0 0 0 0-2Z"/>
        <text x="32" y="18" fill="#f2f0ff" font-size="22" font-weight="800">Tab Share</text>
      </g>

      <!-- welcome header (highlighted, first open) -->
      <g transform="translate(120,132)">
        <rect width="960" height="52" rx="12" fill="#2c2748"/>
        <text x="18" y="22" fill="#c9b8ff" font-size="11" font-weight="700" letter-spacing="0.6">WELCOME TO TAB SHARE</text>
        <text x="18" y="40" fill="#e7e3ff" font-size="12.5">Pick your setup below, then use the toolbar button to turn a group of tabs into one link.</text>
      </g>

      <!-- left column -->
      <g transform="translate(120,204)">
        <!-- preferences -->
        <rect width="288" height="272" rx="12" fill="#1d1d25" stroke="#33333d"/>
        <text x="16" y="26" fill="#a99cf0" font-size="11" font-weight="700" letter-spacing="0.6">PREFERENCES</text>
        <!-- spotlighted site-icons row -->
        <rect x="8" y="36" width="272" height="66" rx="8" fill="#2c2748"/>
        <rect x="20" y="46" width="15" height="15" rx="4" fill="#24242e" stroke="#4a4a5c"/>
        <text x="44" y="58" font-size="12" font-weight="600" fill="#ececf1">Show real site icons</text>
        <text x="44" y="76" font-size="10.5" fill="#9a9aa8">Off by default. On, the viewer fetches one</text>
        <text x="44" y="90" font-size="10.5" fill="#9a9aa8">favicon per domain when a link is opened.</text>
        <g font-size="12" font-weight="600" fill="#ececf1">
          <rect x="16" y="118" width="15" height="15" rx="4" fill="#2c2748" stroke="#4a4276"/>
          <path d="M20 126l3 3 5-6" stroke="#9a8dff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="40" y="130">Auto-load live previews</text>
          <rect x="16" y="152" width="15" height="15" rx="4" fill="#2c2748" stroke="#4a4276"/>
          <path d="M20 160l3 3 5-6" stroke="#9a8dff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="40" y="164">Show "Open with Tab Share"</text>
          <rect x="16" y="186" width="15" height="15" rx="4" fill="#2c2748" stroke="#4a4276"/>
          <path d="M20 194l3 3 5-6" stroke="#9a8dff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="40" y="198">Open its menu automatically</text>
        </g>
        <text x="16" y="238" fill="#9a9aa8" font-size="11" font-weight="600">Default action</text>
        <rect x="16" y="246" width="256" height="28" rx="8" fill="#24242e" stroke="#3a3a47"/>
        <text x="30" y="264" fill="#ececf1" font-size="12">Ask each time</text>

        <!-- support -->
        <g transform="translate(0,288)">
          <rect width="288" height="126" rx="12" fill="#1d1d25" stroke="#33333d"/>
          <text x="16" y="24" fill="#a99cf0" font-size="11" font-weight="700" letter-spacing="0.6">SUPPORT &amp; FEEDBACK</text>
          <g transform="translate(16,36)">
            <rect width="220" height="38" rx="11" fill="#FF5E5B"/>
            <g transform="translate(14,7)" fill="#fff">
              <circle cx="5" cy="6" r="4"/><circle cx="11" cy="4" r="5"/><circle cx="17" cy="6" r="4"/>
              <rect x="2" y="7" width="16" height="17" rx="3"/>
              <path d="M18 10 h4 a4.5 4.5 0 0 1 0 9 h-4" fill="none" stroke="#fff" stroke-width="2.6"/>
            </g>
            <text x="46" y="24" fill="#fff" font-size="13" font-weight="700">Buy me a Beer</text>
            <text x="206" y="25" text-anchor="end" fill="#fff" font-size="10" font-weight="600" opacity="0.9">ko-fi</text>
          </g>
          <text x="16" y="100" fill="#9a8dff" font-size="11.5">Report a bug</text>
          <text x="104" y="100" fill="#9a8dff" font-size="11.5">Request a feature</text>
        </g>

        <!-- privacy -->
        <g transform="translate(0,428)">
          <rect width="288" height="120" rx="12" fill="#1d1d25" stroke="#33333d"/>
          <text x="16" y="24" fill="#a99cf0" font-size="11" font-weight="700" letter-spacing="0.6">PRIVACY</text>
          <text x="16" y="46" fill="#9a9aa8" font-size="10.5">The page list lives in the URL after #, which</text>
          <text x="16" y="60" fill="#9a9aa8" font-size="10.5">browsers never send to a server. Site icons</text>
          <text x="16" y="74" fill="#9a9aa8" font-size="10.5">and the shortener are the only things that</text>
          <text x="16" y="88" fill="#9a9aa8" font-size="10.5">can make a request &#8212; both off-able above.</text>
          <text x="16" y="108" fill="#9a8dff" font-size="11.5">Full privacy policy &#8594;</text>
        </g>
      </g>

      <!-- right column -->
      <g transform="translate(432,204)">
        <rect width="648" height="128" rx="12" fill="#1d1d25" stroke="#33333d"/>
        <text x="18" y="26" fill="#a99cf0" font-size="11" font-weight="700" letter-spacing="0.6">VIEWER BASE URL</text>
        <text x="18" y="48" fill="#9a9aa8" font-size="11.5">Where a share link opens. Must be an https:// address you control.</text>
        <rect x="18" y="60" width="612" height="32" rx="9" fill="#24242e" stroke="#3a3a47"/>
        <text x="32" y="81" fill="#ececf1" font-size="12" font-family="ui-monospace, Menlo, monospace">https://kaikayy.github.io/multi-link-share/</text>
        <rect x="18" y="102" width="54" height="18" rx="6" fill="#9a8dff"/>
        <text x="45" y="115" text-anchor="middle" fill="#16121f" font-size="11" font-weight="700">Save</text>

        <g transform="translate(0,144)">
          <rect width="648" height="266" rx="12" fill="#1d1d25" stroke="#33333d"/>
          <text x="18" y="26" fill="#a99cf0" font-size="11" font-weight="700" letter-spacing="0.6">SHORTEN LINKS (OPTIONAL)</text>
          <g transform="translate(18,40)" font-size="12">
            <rect width="200" height="32" rx="9" fill="#24242e" stroke="#3a3a47"/>
            <text x="14" y="21" fill="#ececf1">Tab Share shortener</text>
            <rect x="214" width="230" height="32" rx="9" fill="#24242e" stroke="#3a3a47"/>
            <text x="228" y="21" fill="#ececf1" font-family="ui-monospace, Menlo, monospace">https://tabsha.re</text>
            <rect x="458" width="154" height="32" rx="9" fill="#24242e" stroke="#3a3a47"/>
            <text x="472" y="21" fill="#ececf1">Readable words</text>
          </g>
          <g transform="translate(18,90)">
            <rect width="612" height="86" rx="10" fill="#20202c" stroke="#4a4276"/>
            <rect width="3" height="86" rx="1.5" fill="#9a8dff"/>
            <text x="16" y="24" fill="#c9c4de" font-size="11.5" font-weight="600">Your Viewer base URL is always yours to set.</text>
            <text x="16" y="44" fill="#9a9aa8" font-size="11">A shortener only shortens links whose viewer host is on its allowlist. Your own</text>
            <text x="16" y="60" fill="#9a9aa8" font-size="11">shortener allows your own viewer; someone else's has to opt your host in.</text>
          </g>
          <rect x="18" y="196" width="15" height="15" rx="4" fill="#24242e" stroke="#4a4a5c"/>
          <text x="42" y="208" fill="#ececf1" font-size="12" font-weight="600">Shorten automatically</text>
        </g>

        <g transform="translate(0,424)">
          <rect width="648" height="100" rx="12" fill="#1d1d25" stroke="#33333d"/>
          <text x="18" y="26" fill="#a99cf0" font-size="11" font-weight="700" letter-spacing="0.6">HISTORY</text>
          <text x="18" y="50" fill="#9a9aa8" font-size="12" font-family="ui-monospace, Menlo, monospace">Research on hummingbirds &#183; 7 pages &#183; today</text>
          <text x="18" y="70" fill="#9a9aa8" font-size="12" font-family="ui-monospace, Menlo, monospace">Q3 launch reading &#183; 12 pages &#183; yesterday</text>
        </g>
      </g>

      <text x="600" y="770" text-anchor="middle" fill="#6b6b78" font-size="11">Everything on this page is optional and stored on this device only.</text>
    </g>
  </g>

  <text x="640" y="784" text-anchor="middle" fill="#6b6b78" font-size="13">Options page &#8212; welcome banner, preferences + support + privacy on the left, the bigger tiles on the right</text>
</svg>
