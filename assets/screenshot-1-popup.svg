<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2340"/><stop offset="1" stop-color="#3a2350"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7dff"/><stop offset="0.55" stop-color="#d76ad4"/><stop offset="1" stop-color="#ff9d6c"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#0c0814" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1280" height="800" fill="url(#wall)"/>

  <!-- browser toolbar hint -->
  <rect x="0" y="0" width="1280" height="56" fill="#1c1930"/>
  <circle cx="28" cy="28" r="6" fill="#ff5f57"/><circle cx="48" cy="28" r="6" fill="#febc2e"/><circle cx="68" cy="28" r="6" fill="#28c840"/>
  <rect x="110" y="14" width="900" height="28" rx="14" fill="#2b2740"/>
  <text x="128" y="33" fill="#8b88a5" font-size="13">app.example.com/dashboard</text>
  <rect x="1150" y="12" width="32" height="32" rx="8" fill="url(#mark)"/>
  <rect x="1157" y="22" width="11" height="13" rx="2" fill="#ffffff" fill-opacity="0.6"/>
  <rect x="1160" y="19" width="11" height="13" rx="2" fill="#fff"/>

  <!-- popup -->
  <g transform="translate(838,60)" filter="url(#drop)">
    <rect width="400" height="700" rx="16" fill="#1a1a20"/>
    <!-- app bar -->
    <rect width="400" height="46" rx="16" fill="#1a1a20"/>
    <rect y="20" width="400" height="26" fill="#1a1a20"/>
    <rect x="16" y="13" width="22" height="22" rx="6" fill="url(#mark)"/>
    <text x="46" y="29" fill="#ececf1" font-size="14" font-weight="700">Tab Share</text>
    <line x1="0" y1="46" x2="400" y2="46" stroke="#35353f"/>

    <!-- segmented -->
    <g transform="translate(16,62)">
      <rect width="368" height="36" rx="10" fill="#23232c"/>
      <rect x="3" y="3" width="120" height="30" rx="7" fill="#24242e"/>
      <text x="63" y="23" text-anchor="middle" fill="#ececf1" font-size="12.5" font-weight="600">This window</text>
      <text x="185" y="23" text-anchor="middle" fill="#9a9aa8" font-size="12.5" font-weight="600">Tab group</text>
      <text x="305" y="23" text-anchor="middle" fill="#9a9aa8" font-size="12.5" font-weight="600">Paste links</text>
    </g>

    <!-- name field -->
    <text x="16" y="128" fill="#9a9aa8" font-size="12" font-weight="600">Collection name</text>
    <rect x="16" y="136" width="368" height="34" rx="8" fill="#24242e" stroke="#35353f"/>
    <text x="27" y="158" fill="#ececf1" font-size="13">Research on hummingbirds</text>

    <text x="16" y="192" fill="#9a9aa8" font-size="12" font-weight="700">6 pages selected</text>
    <text x="330" y="192" fill="#9a8dff" font-size="12">select all</text>

    <!-- rows -->
    <g transform="translate(16,204)">
      <!-- row template -->
      <g>
        <rect width="368" height="44" rx="8" fill="#24242e" stroke="#35353f"/>
        <rect x="8" y="11" width="15" height="15" rx="3" fill="#6d5efc"/>
        <rect x="31" y="11" width="22" height="22" rx="6" fill="#6366F1"/>
        <text x="42" y="26" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">EN</text>
        <text x="64" y="20" fill="#ececf1" font-size="12.5" font-weight="600">Anna's hummingbird — Wikipedia</text>
        <text x="64" y="34" fill="#9a9aa8" font-size="11">en.wikipedia.org</text>
      </g>
      <g transform="translate(0,50)">
        <rect width="368" height="44" rx="8" fill="#24242e" stroke="#35353f"/>
        <rect x="8" y="11" width="15" height="15" rx="3" fill="#6d5efc"/>
        <rect x="31" y="11" width="22" height="22" rx="6" fill="#10B981"/>
        <text x="42" y="26" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">AL</text>
        <text x="64" y="20" fill="#ececf1" font-size="12.5" font-weight="600">Hummingbird flight mechanics</text>
        <text x="64" y="34" fill="#9a9aa8" font-size="11">allaboutbirds.org</text>
      </g>
      <g transform="translate(0,100)">
        <rect width="368" height="44" rx="8" fill="#24242e" stroke="#35353f"/>
        <rect x="8" y="11" width="15" height="15" rx="3" fill="#6d5efc"/>
        <rect x="31" y="11" width="22" height="22" rx="6" fill="#EC4899"/>
        <text x="42" y="26" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">YO</text>
        <text x="64" y="20" fill="#ececf1" font-size="12.5" font-weight="600">Slow-motion hummingbird (video)</text>
        <text x="64" y="34" fill="#9a9aa8" font-size="11">youtube.com</text>
      </g>
      <g transform="translate(0,150)">
        <rect width="368" height="44" rx="8" fill="#24242e" stroke="#35353f"/>
        <rect x="8" y="11" width="15" height="15" rx="3" fill="#6d5efc"/>
        <rect x="31" y="11" width="22" height="22" rx="6" fill="#F59E0B"/>
        <text x="42" y="26" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">RE</text>
        <text x="64" y="20" fill="#ececf1" font-size="12.5" font-weight="600">Feeder placement guide</text>
        <text x="64" y="34" fill="#9a9aa8" font-size="11">researchgate.net</text>
      </g>
      <g transform="translate(0,200)">
        <rect width="368" height="44" rx="8" fill="#24242e" stroke="#35353f"/>
        <rect x="8" y="11" width="15" height="15" rx="3" fill="#6d5efc"/>
        <rect x="31" y="11" width="22" height="22" rx="6" fill="#06B6D4"/>
        <text x="42" y="26" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">NA</text>
        <text x="64" y="20" fill="#ececf1" font-size="12.5" font-weight="600">Migration range maps</text>
        <text x="64" y="34" fill="#9a9aa8" font-size="11">nature.org</text>
      </g>
    </g>

    <!-- footer -->
    <line x1="0" y1="642" x2="400" y2="642" stroke="#35353f"/>
    <rect x="16" y="654" width="368" height="38" rx="9" fill="#6d5efc"/>
    <text x="200" y="678" text-anchor="middle" fill="#fff" font-size="13.5" font-weight="700">Create share link</text>
  </g>

  <!-- caption -->
  <text x="60" y="120" fill="#ffffff" font-size="42" font-weight="800">Pick tabs.</text>
  <text x="60" y="172" fill="#ffffff" font-size="42" font-weight="800">Get one link.</text>
  <text x="62" y="214" fill="#c9c4e6" font-size="17">From the current window, a tab group, or links you paste.</text>
</svg>
