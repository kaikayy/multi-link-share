<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191527"/><stop offset="1" stop-color="#241a33"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7dff"/><stop offset="0.55" stop-color="#d76ad4"/><stop offset="1" stop-color="#ff9d6c"/>
    </linearGradient>
    <filter id="win" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="38" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <circle cx="1140" cy="80" r="340" fill="#8b7dff" opacity="0.10"/>

  <g transform="translate(56,56)" filter="url(#win)">
    <rect width="1168" height="688" rx="18" fill="#17171d" stroke="#33333d"/>
    <clipPath id="clipV"><rect width="1168" height="688" rx="18"/></clipPath>
    <g clip-path="url(#clipV)">
      <!-- top bar -->
      <rect width="1168" height="58" fill="#1e1e26"/>
      <rect x="24" y="19" width="20" height="20" rx="5" fill="url(#mark)"/>
      <text x="54" y="34" fill="#ececf1" font-size="15" font-weight="700">Research on hummingbirds</text>
      <text x="330" y="34" fill="#8a8a98" font-size="13">7 pages &#183; password-protected</text>

      <g transform="translate(770,13)" font-size="13" font-weight="600">
        <rect width="118" height="32" rx="9" fill="#26262f" stroke="#3a3a47"/>
        <text x="59" y="21" text-anchor="middle" fill="#ececf1">Change View</text>
        <rect x="130" y="0" width="78" height="32" rx="9" fill="#26262f" stroke="#3a3a47"/>
        <text x="169" y="21" text-anchor="middle" fill="#ececf1">Select</text>
        <rect x="220" y="0" width="150" height="32" rx="9" fill="#9a8dff"/>
        <text x="295" y="21" text-anchor="middle" fill="#16121f">Open all 7 pages</text>
      </g>

      <!-- stage -->
      <text x="584" y="98" text-anchor="middle" fill="#c9c4de" font-size="15" font-weight="600">3 / 7 &#8212; Slow-motion hummingbird flight</text>
      <text x="584" y="120" text-anchor="middle" fill="#7c7c8c" font-size="12" font-family="ui-monospace, Menlo, monospace">youtube.com/watch?v=&#8230;</text>

      <!-- framed page -->
      <g transform="translate(214,140)">
        <rect width="740" height="452" rx="14" fill="#0f0f16" stroke="#2c2c37"/>
        <rect width="740" height="40" rx="14" fill="#181820"/>
        <rect y="20" width="740" height="20" fill="#181820"/>
        <circle cx="20" cy="20" r="4" fill="#3a3a47"/><circle cx="34" cy="20" r="4" fill="#3a3a47"/><circle cx="48" cy="20" r="4" fill="#3a3a47"/>
        <rect x="230" y="10" width="280" height="20" rx="10" fill="#0f0f16"/>

        <rect x="60" y="78" width="620" height="220" rx="10" fill="#1b1b24"/>
        <path d="M340 165 l52 30 -52 30 Z" fill="#d76ad4"/>
        <rect x="60" y="322" width="360" height="16" rx="8" fill="#26262f"/>
        <rect x="60" y="352" width="600" height="10" rx="5" fill="#20202a"/>
        <rect x="60" y="374" width="560" height="10" rx="5" fill="#20202a"/>
        <rect x="60" y="396" width="590" height="10" rx="5" fill="#20202a"/>
      </g>

      <!-- arrows -->
      <g stroke="#ececf1" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M150 360 l-22 22 22 22"/>
        <path d="M1018 360 l22 22 -22 22"/>
      </g>

      <!-- pager -->
      <g transform="translate(584,632)">
        <rect x="-176" y="-14" width="352" height="28" rx="14" fill="#1e1e26"/>
        <g fill="#4a4a5c">
          <rect x="-158" y="-5" width="20" height="10" rx="5"/>
          <circle cx="-116" cy="0" r="5"/>
          <rect x="-100" y="-6" width="28" height="12" rx="6" fill="#9a8dff"/>
          <circle cx="-42" cy="0" r="5"/><circle cx="-14" cy="0" r="5"/><circle cx="14" cy="0" r="5"/>
          <circle cx="42" cy="0" r="5"/>
          <rect x="130" y="-5" width="20" height="10" rx="5"/>
        </g>
      </g>
    </g>
  </g>

  <text x="640" y="778" text-anchor="middle" fill="#6b6b78" font-size="13">The shared viewer &#183; slideshow view (recipient needs no extension)</text>
</svg>
