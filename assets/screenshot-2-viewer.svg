<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <radialGradient id="wall" cx="50%" cy="-10%" r="80%">
      <stop offset="0" stop-color="#16161f"/><stop offset="1" stop-color="#0f0f16"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7dff"/><stop offset="0.55" stop-color="#d76ad4"/><stop offset="1" stop-color="#ff9d6c"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="40" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1280" height="800" fill="url(#wall)"/>

  <!-- top bar -->
  <rect x="0" y="0" width="1280" height="66" fill="#12121b"/>
  <line x1="0" y1="66" x2="1280" y2="66" stroke="#34343f"/>
  <rect x="32" y="18" width="30" height="30" rx="9" fill="url(#mark)"/>
  <rect x="38" y="28" width="12" height="14" rx="3" fill="#ffffff" fill-opacity="0.6"/>
  <rect x="42" y="24" width="12" height="14" rx="3" fill="#fff"/>
  <text x="76" y="30" fill="#f0f0f5" font-size="14" font-weight="700">Research on hummingbirds</text>
  <text x="76" y="48" fill="#9c9cad" font-size="12">6 pages · shared Aug 31, 2026</text>

  <rect x="946" y="16" width="96" height="34" rx="10" fill="#1e1e29" stroke="#34343f"/>
  <text x="994" y="38" text-anchor="middle" fill="#f0f0f5" font-size="12.5" font-weight="600">Open all</text>
  <rect x="1050" y="16" width="96" height="34" rx="10" fill="#1e1e29" stroke="#34343f"/>
  <text x="1098" y="38" text-anchor="middle" fill="#f0f0f5" font-size="12.5" font-weight="600">Copy list</text>
  <rect x="1154" y="16" width="94" height="34" rx="10" fill="#8b7dff"/>
  <text x="1201" y="38" text-anchor="middle" fill="#14101f" font-size="12.5" font-weight="700">Grid</text>

  <!-- side nav -->
  <rect x="70" y="360" width="44" height="64" rx="12" fill="#1e1e29" stroke="#34343f"/>
  <path d="M97 380 l-10 12 10 12" fill="none" stroke="#f0f0f5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1166" y="360" width="44" height="64" rx="12" fill="#1e1e29" stroke="#34343f"/>
  <path d="M1183 380 l10 12 -10 12" fill="none" stroke="#f0f0f5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- frame -->
  <g transform="translate(154,104)" filter="url(#drop)">
    <rect width="972" height="560" rx="18" fill="#1e1e29" stroke="#34343f"/>
    <rect width="972" height="42" rx="18" fill="#262633"/>
    <rect y="22" width="972" height="20" fill="#262633"/>
    <circle cx="22" cy="21" r="4.5" fill="#3a3a47"/><circle cx="38" cy="21" r="4.5" fill="#3a3a47"/><circle cx="54" cy="21" r="4.5" fill="#3a3a47"/>
    <text x="486" y="26" text-anchor="middle" fill="#9c9cad" font-size="12.5" font-weight="600">3. Slow-motion hummingbird (video)</text>
    <text x="915" y="26" text-anchor="middle" fill="#8b7dff" font-size="12" font-weight="700">Open ↗</text>

    <!-- viewport hatch -->
    <rect x="1" y="43" width="970" height="516" fill="#191922"/>
    <!-- rich card -->
    <g transform="translate(486,300)">
      <g transform="translate(-32,-150)">
        <rect width="64" height="64" rx="18" fill="#EC4899"/>
        <text x="32" y="42" text-anchor="middle" fill="#fff" font-size="24" font-weight="800">YO</text>
      </g>
      <text x="0" y="-56" text-anchor="middle" fill="#f0f0f5" font-size="18" font-weight="700">Slow-motion hummingbird (video)</text>
      <text x="0" y="-32" text-anchor="middle" fill="#8b7dff" font-size="13" font-weight="600">youtube.com</text>
      <text x="0" y="-10" text-anchor="middle" fill="#9c9cad" font-size="11" font-family="ui-monospace, Menlo, monospace">https://youtube.com/watch?v=hummingbird-4k</text>
      <rect x="-150" y="14" width="150" height="38" rx="10" fill="#8b7dff"/>
      <text x="-75" y="38" text-anchor="middle" fill="#14101f" font-size="12.5" font-weight="700">Open this page</text>
      <rect x="8" y="14" width="142" height="38" rx="10" fill="#1e1e29" stroke="#34343f"/>
      <text x="79" y="38" text-anchor="middle" fill="#f0f0f5" font-size="12.5" font-weight="600">Try live preview</text>
      <text x="0" y="86" text-anchor="middle" fill="#6b6b78" font-size="10.5">Live preview is best-effort — many sites refuse to display inside another page.</text>
    </g>
  </g>

  <!-- counter -->
  <g transform="translate(640,702)">
    <rect x="-170" y="-18" width="34" height="34" rx="8" fill="#1e1e29" stroke="#34343f"/>
    <path d="M-149 -8 l-7 8 7 8" fill="none" stroke="#f0f0f5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="-90" y="4" text-anchor="middle" fill="#f0f0f5" font-size="13" font-weight="700">3 / 6</text>
    <rect x="-50" y="-18" width="34" height="34" rx="8" fill="#1e1e29" stroke="#34343f"/>
    <path d="M-31 -8 l7 8 -7 8" fill="none" stroke="#f0f0f5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="0" y="-3" width="200" height="4" rx="2" fill="#34343f"/>
    <rect x="0" y="-3" width="80" height="4" rx="2" fill="#8b7dff"/>
  </g>
</svg>
