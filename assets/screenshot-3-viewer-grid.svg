<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191527"/><stop offset="1" stop-color="#241a33"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7dff"/><stop offset="0.55" stop-color="#d76ad4"/><stop offset="1" stop-color="#ff9d6c"/>
    </linearGradient>
    <filter id="win" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="38" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <circle cx="1140" cy="80" r="340" fill="#8b7dff" opacity="0.10"/>

  <g transform="translate(56,56)" filter="url(#win)">
    <rect width="1168" height="688" rx="18" fill="#17171d" stroke="#33333d"/>
    <clipPath id="clipG"><rect width="1168" height="688" rx="18"/></clipPath>
    <g clip-path="url(#clipG)">
      <rect width="1168" height="58" fill="#1e1e26"/>
      <rect x="24" y="19" width="20" height="20" rx="5" fill="url(#mark)"/>
      <text x="54" y="34" fill="#ececf1" font-size="15" font-weight="700">Research on hummingbirds</text>

      <g transform="translate(360,14)" font-size="12.5" font-weight="600">
        <rect width="92" height="30" rx="8" fill="#26262f" stroke="#3a3a47"/><text x="46" y="20" text-anchor="middle" fill="#9a9aa8">Slideshow</text>
        <rect x="100" width="112" height="30" rx="8" fill="#26262f" stroke="#3a3a47"/><text x="156" y="20" text-anchor="middle" fill="#9a9aa8">Preview Grid</text>
        <rect x="220" width="66" height="30" rx="8" fill="#2c2748" stroke="#4a4276"/><text x="253" y="20" text-anchor="middle" fill="#ececf1">Grid</text>
        <rect x="294" width="60" height="30" rx="8" fill="#26262f" stroke="#3a3a47"/><text x="324" y="20" text-anchor="middle" fill="#9a9aa8">List</text>
      </g>

      <g transform="translate(770,13)" font-size="13" font-weight="600">
        <rect width="200" height="32" rx="9" fill="#24242e" stroke="#3a3a47"/>
        <circle cx="24" cy="15" r="6" fill="none" stroke="#7c7c8c" stroke-width="2"/>
        <path d="M28.5 19.5l4 4" stroke="#7c7c8c" stroke-width="2" stroke-linecap="round"/>
        <text x="120" y="21" text-anchor="middle" fill="#9a9aa8">Search titles / sites</text>
        <rect x="214" width="150" height="32" rx="9" fill="#9a8dff"/>
        <text x="289" y="21" text-anchor="middle" fill="#16121f">Open all 7 pages</text>
      </g>

      <!-- grid of cards -->
      <g transform="translate(40,84)">
        <!-- row 1 -->
        <g>
          <rect width="352" height="176" rx="14" fill="#20202a" stroke="#33333d"/>
          <rect x="16" y="16" width="320" height="96" rx="10" fill="#15151d"/>
          <circle cx="176" cy="64" r="22" fill="#8b7dff"/><text x="176" y="71" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">A</text>
          <text x="16" y="138" fill="#ececf1" font-size="13.5" font-weight="600">Anna's Hummingbird &#8212; Cornell Lab</text>
          <text x="16" y="158" fill="#8a8a98" font-size="11.5">allaboutbirds.org</text>
        </g>
        <g transform="translate(376,0)">
          <rect width="352" height="176" rx="14" fill="#20202a" stroke="#33333d"/>
          <rect x="16" y="16" width="320" height="96" rx="10" fill="#15151d"/>
          <circle cx="176" cy="64" r="22" fill="#d76ad4"/><text x="176" y="71" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">W</text>
          <text x="16" y="138" fill="#ececf1" font-size="13.5" font-weight="600">Hummingbird &#8212; Wikipedia</text>
          <text x="16" y="158" fill="#8a8a98" font-size="11.5">en.wikipedia.org</text>
        </g>
        <g transform="translate(752,0)">
          <rect width="352" height="176" rx="14" fill="#20202a" stroke="#33333d"/>
          <rect x="16" y="16" width="320" height="96" rx="10" fill="#15151d"/>
          <path d="M164 50 l30 16 -30 16 Z" fill="#ff9d6c"/>
          <text x="16" y="138" fill="#ececf1" font-size="13.5" font-weight="600">Slow-motion hummingbird flight</text>
          <text x="16" y="158" fill="#8a8a98" font-size="11.5">youtube.com</text>
        </g>
        <!-- row 2 -->
        <g transform="translate(0,196)">
          <rect width="352" height="176" rx="14" fill="#20202a" stroke="#33333d"/>
          <rect x="16" y="16" width="320" height="96" rx="10" fill="#15151d"/>
          <circle cx="176" cy="64" r="22" fill="#5bc0a8"/><text x="176" y="71" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">N</text>
          <text x="16" y="138" fill="#ececf1" font-size="13.5" font-weight="600">Feeder placement guide (PDF)</text>
          <text x="16" y="158" fill="#8a8a98" font-size="11.5">nationalgeographic.com</text>
        </g>
        <g transform="translate(376,196)">
          <rect width="352" height="176" rx="14" fill="#20202a" stroke="#33333d"/>
          <rect x="16" y="16" width="320" height="96" rx="10" fill="#15151d"/>
          <circle cx="176" cy="64" r="22" fill="#7d8cff"/><text x="176" y="71" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">R</text>
          <text x="16" y="138" fill="#ececf1" font-size="13.5" font-weight="600">Migration map 2026</text>
          <text x="16" y="158" fill="#8a8a98" font-size="11.5">journeynorth.org</text>
        </g>
        <g transform="translate(752,196)">
          <rect width="352" height="176" rx="14" fill="#20202a" stroke="#33333d"/>
          <rect x="16" y="16" width="320" height="96" rx="10" fill="#15151d"/>
          <circle cx="176" cy="64" r="22" fill="#e0a44b"/><text x="176" y="71" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">S</text>
          <text x="16" y="138" fill="#ececf1" font-size="13.5" font-weight="600">Sibley guide: identification</text>
          <text x="16" y="158" fill="#8a8a98" font-size="11.5">sibleyguides.com</text>
        </g>
        <!-- row 3 (peeking) -->
        <g transform="translate(0,392)" opacity="0.55">
          <rect width="352" height="120" rx="14" fill="#20202a" stroke="#33333d"/>
          <rect x="16" y="16" width="320" height="88" rx="10" fill="#15151d"/>
        </g>
        <g transform="translate(376,392)" opacity="0.55">
          <rect width="352" height="120" rx="14" fill="#20202a" stroke="#33333d"/>
          <rect x="16" y="16" width="320" height="88" rx="10" fill="#15151d"/>
        </g>
      </g>
    </g>
  </g>

  <text x="640" y="778" text-anchor="middle" fill="#6b6b78" font-size="13">The shared viewer &#183; grid view with per-view search</text>
</svg>
