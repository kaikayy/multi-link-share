<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7dff"/>
      <stop offset="0.55" stop-color="#d76ad4"/>
      <stop offset="1" stop-color="#ff9d6c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1a1030" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- full-bleed so a circular crop still shows the gradient -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- mark kept inside the centre ~320px safe zone -->
  <g transform="translate(122,120)">
    <rect x="0" y="40" width="150" height="176" rx="30" fill="#ffffff" fill-opacity="0.42"/>
    <g filter="url(#soft)">
      <rect x="24" y="16" width="150" height="176" rx="30" fill="#ffffff"/>
      <rect x="48" y="42" width="42" height="13" rx="6" fill="#d76ad4"/>
      <rect x="48" y="82" width="102" height="12" rx="6" fill="#cbc8e8"/>
      <rect x="48" y="112" width="102" height="12" rx="6" fill="#cbc8e8"/>
      <rect x="48" y="142" width="68" height="12" rx="6" fill="#cbc8e8"/>
    </g>
    <g filter="url(#soft)">
      <circle cx="196" cy="200" r="52" fill="#14101f"/>
      <path d="M196 176 v48 M196 176 l-18 18 M196 176 l18 18" fill="none" stroke="#ffffff"
            stroke-width="13.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
