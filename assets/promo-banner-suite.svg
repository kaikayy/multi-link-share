<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171622"/>
      <stop offset="1" stop-color="#241a33"/>
    </linearGradient>
    <linearGradient id="gExt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7dff"/>
      <stop offset="1" stop-color="#d76ad4"/>
    </linearGradient>
    <linearGradient id="gShort" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d76ad4"/>
      <stop offset="1" stop-color="#ffb27a"/>
    </linearGradient>
    <linearGradient id="gFull" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7dff"/>
      <stop offset="0.55" stop-color="#d76ad4"/>
      <stop offset="1" stop-color="#ff9d6c"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1170" cy="56" r="380" fill="#8b7dff" opacity="0.10"/>
  <circle cx="80" cy="650" r="280" fill="#ff9d6c" opacity="0.07"/>

  <!-- brand row -->
  <g transform="translate(96,56)">
    <rect width="62" height="62" rx="16" fill="url(#gFull)"/>
    <rect x="11" y="20" width="26" height="31" rx="5" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="21" y="11" width="26" height="31" rx="5" fill="#ffffff"/>
    <circle cx="47" cy="47" r="12" fill="#14101f"/>
    <path d="M47 41 v13 M47 41 l-5 5 M47 41 l5 5" fill="none" stroke="#fff" stroke-width="3.2"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="82" y="28" fill="#f0f0f5" font-size="30" font-weight="700">Tab Share</text>
    <g transform="translate(232,7)">
      <rect width="76" height="26" rx="13" fill="none" stroke="url(#gFull)" stroke-width="2"/>
      <text x="38" y="18" text-anchor="middle" fill="#e7e3ff" font-size="13" font-weight="700" letter-spacing="2">SUITE</text>
    </g>
    <text x="82" y="53" fill="#9c9cad" font-size="15">the browser extension + its companion link shortener &#183; AGPL-3.0</text>
  </g>

  <!-- headline -->
  <text x="96" y="196" fill="#f5f3ff" font-size="48" font-weight="800">One link for a whole group of tabs.</text>
  <text x="96" y="242" fill="#cfc9e8" font-size="23" font-weight="500">The <tspan fill="#c9b8ff" font-weight="700">extension</tspan> packs the pages into the link; any browser opens it, no extension needed.</text>
  <text x="96" y="274" fill="#cfc9e8" font-size="23" font-weight="500">The <tspan fill="#ffb98f" font-weight="700">shortener</tspan> (optional, self-hosted) squeezes that link down to a stub.</text>

  <!-- pipeline -->
  <g transform="translate(96,318)">
    <!-- tab group -->
    <g filter="url(#soft)">
      <rect x="0" y="16" width="140" height="90" rx="12" fill="#1e1e29" stroke="#34343f"/>
      <rect x="8" y="8" width="140" height="90" rx="12" fill="#232332" stroke="#3a3a47"/>
      <rect x="16" y="0" width="140" height="90" rx="12" fill="#2a2a3b" stroke="#463f6b"/>
      <rect x="30" y="18" width="110" height="9" rx="4" fill="#8b7dff"/>
      <rect x="30" y="36" width="110" height="7" rx="3" fill="#4a4a5c"/>
      <rect x="30" y="52" width="86" height="7" rx="3" fill="#4a4a5c"/>
      <rect x="30" y="68" width="96" height="7" rx="3" fill="#4a4a5c"/>
    </g>
    <text x="80" y="128" text-anchor="middle" fill="#9c9cad" font-size="13" font-weight="600">tab group</text>

    <path d="M174 52 h40 m-11 -8 l11 8 -11 8" fill="none" stroke="#7d7d8c" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- one link (extension) -->
    <g transform="translate(230,27)">
      <rect width="250" height="50" rx="25" fill="#20202c" stroke="#5a4fa0"/>
      <circle cx="27" cy="25" r="10" fill="url(#gExt)"/>
      <text x="48" y="30" fill="#e7e3ff" font-size="13.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">kaikayy.github.io/&#8230;#No&#8230;</text>
    </g>
    <text x="355" y="128" text-anchor="middle" fill="#9c9cad" font-size="13" font-weight="600">one link &#183; ~6 KB</text>

    <!-- shortener node on the arrow -->
    <path d="M494 52 h30 m84 0 h30 m-11 -8 l11 8 -11 8" fill="none" stroke="#7d7d8c" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(524,30)">
      <rect width="84" height="44" rx="12" fill="url(#gShort)"/>
      <text x="42" y="21" text-anchor="middle" fill="#14101f" font-size="12" font-weight="800">/new</text>
      <text x="42" y="36" text-anchor="middle" fill="#14101f" font-size="10" font-weight="600" opacity="0.8">shorten</text>
    </g>

    <!-- short link (shortener) -->
    <g transform="translate(638,27)">
      <rect width="230" height="50" rx="25" fill="#20202c" stroke="#a06a4f"/>
      <circle cx="27" cy="25" r="10" fill="url(#gShort)"/>
      <text x="48" y="30" fill="#f4e6ea" font-size="13.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">s.kaikay.de/k7Rm2pq</text>
    </g>
    <text x="753" y="128" text-anchor="middle" fill="#9c9cad" font-size="13" font-weight="600">short link &#183; 21 chars</text>

    <path d="M884 52 h40 m-11 -8 l11 8 -11 8" fill="none" stroke="#7d7d8c" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- slideshow (extension) -->
    <g transform="translate(940,0)" filter="url(#soft)">
      <rect width="128" height="104" rx="12" fill="#1e1e29" stroke="#34343f"/>
      <rect width="128" height="20" rx="12" fill="#262633"/>
      <rect y="10" width="128" height="10" fill="#262633"/>
      <circle cx="12" cy="10" r="3" fill="#3a3a47"/><circle cx="22" cy="10" r="3" fill="#3a3a47"/><circle cx="32" cy="10" r="3" fill="#3a3a47"/>
      <rect x="42" y="38" width="44" height="36" rx="8" fill="#d76ad4"/>
      <path d="M14 56 l-7 7 7 7 M114 56 l7 7 -7 7" fill="none" stroke="#f0f0f5" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(44,92)" fill="#3a3a47">
        <circle cx="0" cy="0" r="2.6"/><circle cx="10" cy="0" r="2.6"/><circle cx="20" cy="0" r="2.6" fill="#d76ad4"/><circle cx="30" cy="0" r="2.6"/><circle cx="40" cy="0" r="2.6"/>
      </g>
    </g>
    <text x="1004" y="128" text-anchor="middle" fill="#9c9cad" font-size="13" font-weight="600">slideshow</text>
  </g>

  <!-- what each project does -->
  <g transform="translate(96,500)" font-size="15">
    <g>
      <rect width="196" height="34" rx="17" fill="#221d3a" stroke="#5a4fa0"/>
      <text x="98" y="22" text-anchor="middle" fill="#c9b8ff" font-weight="700">Tab Share extension</text>
    </g>
    <text x="212" y="22" fill="#9c9cad">opens in any browser, no extension &#183; no account, no server, nothing tracked</text>
  </g>
  <g transform="translate(96,544)" font-size="15">
    <g>
      <rect width="196" height="34" rx="17" fill="#2f2230" stroke="#a06a4f"/>
      <text x="98" y="22" text-anchor="middle" fill="#ffb98f" font-weight="700">tab-share-shortener</text>
    </g>
    <text x="212" y="22" fill="#9c9cad">zero-dependency Node or Cloudflare Worker &#183; host-allowlisted so it can't be abused</text>
  </g>

  <text x="96" y="612" fill="#6b6b78" font-size="14">github.com/kaikayy/multi-link-share</text>
  <text x="1184" y="612" text-anchor="end" fill="#6b6b78" font-size="14">github.com/kaikayy/tab-share-shortener</text>
</svg>
