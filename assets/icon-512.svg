<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7dff"/>
      <stop offset="0.55" stop-color="#d76ad4"/>
      <stop offset="1" stop-color="#ff9d6c"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1a1030" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#sheen)"/>
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4"/>

  <!-- back card -->
  <rect x="104" y="160" width="208" height="240" rx="40" fill="#ffffff" fill-opacity="0.45"/>
  <!-- front card -->
  <g filter="url(#soft)">
    <rect x="136" y="128" width="208" height="240" rx="40" fill="#ffffff"/>
    <rect x="168" y="160" width="56" height="16" rx="8" fill="#d76ad4"/>
    <rect x="168" y="216" width="144" height="16" rx="8" fill="#cbc8e8"/>
    <rect x="168" y="256" width="144" height="16" rx="8" fill="#cbc8e8"/>
    <rect x="168" y="296" width="96" height="16" rx="8" fill="#cbc8e8"/>
  </g>

  <!-- share node -->
  <g filter="url(#soft)">
    <circle cx="368" cy="344" r="68" fill="#14101f"/>
    <path d="M368 312 v64 M368 312 l-24 24 M368 312 l24 24" fill="none" stroke="#ffffff"
          stroke-width="17.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
